<!DOCTYPE html>
<html lang ="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiReloj - Mi priner web</title>
        <link rel="stylesheet" href="style.css">
    </head>
    

    <body>

        <header>
            <h1>Mi Reloj</h1>
        </header>

        <main>
            <div class="reloj-card">

                <h2>Reloj digital</h2>
                <p id="hora">00:00:00</p>
                <p id="fecha">Cargando fecha...</p>
            </div>
        <div class="cronometro-card">
            
            <h2>Cronómetro</h2> 
            
            <p id="cronometro">00:00:00</p>
            
            <div class="botones-cronometro">
               
                <button id="iniciar">Iniciar</button>
                <button id="pausar">Pausar</button>
                <button id="reiniciar">Reiniciar</button>  
            </div>

        </div>  
        </main>
<script src="script.js"></script>   
    </body>

</html>
